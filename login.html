<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Manager - Login</title>
    <style>
        /* Reset de Estilos Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #1e293b; /* Slate 800 */
            --accent-color: #2563eb; /* Blue 600 */
            --accent-hover: #1d4ed8; /* Blue 700 */
            --bg-color: #f8fafc; /* Slate 50 */
            --card-bg: #ffffff;
            --text-main: #0f172a; /* Slate 900 */
            --text-muted: #64748b; /* Slate 500 */
            --border-color: #e2e8f0; /* Slate 200 */
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container do Card de Login */
        .login-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        /* Cabeçalho do Login (Logo e Título) */
        .login-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 800;
            font-size: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #60a5fa; /* Blue 400 */
            margin-left: 4px;
        }

        .login-header h1 {
            font-size: 24px;
            color: var(--text-main);
            font-weight: 700;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        /* Formulário */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 211, 0.15);
        }

        /* Botão de Envio */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        /* Rodapé de Ajuda / Simulação de Links */
        .login-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
        }

        .login-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .login-footer a:hover {
            text-decoration: underline;
        }

        /* Responsividade */
        @media (max-width: 480px) {
            .login-container {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <header class="login-header">
            <!-- Logo simples estilizada em CSS puro -->
            <div class="logo">RH<span>Manager</span></div>
            <h1>Entrar</h1>
            <p>Acesse o painel administrativo de RH</p>
        </header>

        <!-- Redireciona para o painel de demonstração ao clicar no botão de submit -->
        <form>
            <div class="form-group">
                <label for="email" class="form-label">E-mail corporativo</label>
                <input 
                    type="text" 
                    id="email" 
                    class="form-input" 
                    placeholder="exemplo@empresa.com" 
                    required
                >
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="password" class="form-label" style="margin-bottom: 0;">Senha</label>
                    <a href="#" style="font-size: 12px; color: var(--accent-color); text-decoration: none;">Esqueceu a senha?</a>
                </div>
                <input 
                    type="password" 
                    id="password" 
                    class="form-input" 
                    placeholder="Sua senha secreta" 
                    required
                >
            </div>

            <button class="btn-submit">Acessar Painel</button>
            <p class="informs"></p>
        </form>

        <footer class="login-footer">
            <span style="color: var(--text-muted);">Precisa de suporte?</span> 
            <a href="#">Fale conosco</a>
        </footer>
    </div>

    <script>
    
     let btn = document.querySelector(".btn-submit")
     let p = document.querySelector(".informs")

       btn.addEventListener('click' , function (event) {
        event.preventDefault();
        // ao utilizar o form para evitar o recarregamento da pagina utilize preventDefault()

     let email = document.getElementById("email").value
     let senha = document.getElementById("password").value

        const correctemail = "sauloalmeida.lp@gmail.com"
        const correctpass =  "123456"

           if (email === correctemail && senha == correctpass) {
              window.location.href = "System/index.html"
           } else {
            p.textContent += "Email ou senha incorretos"
           }
     });




    </script>

</body>
</html>
