<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RH Manager - Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --primary-color: #1e293b;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* ==================== HIDDEN CLASS ==================== */
        .hidden {
            display: none !important;
        }

        /* ==================== CONTAINER ==================== */
        .auth-container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-color);
        }

        /* ==================== HEADER ==================== */
        .auth-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .logo {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background-color: var(--primary-color);
            color: #ffffff;
            font-weight: 800;
            font-size: 20px;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: #60a5fa;
            margin-left: 4px;
        }

        .auth-header h1 {
            font-size: 24px;
            color: var(--text-main);
            font-weight: 700;
        }

        .auth-header p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        /* ==================== FORM STYLES ==================== */
        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .form-input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 15px;
            color: var(--text-main);
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(37, 99, 211, 0.15);
        }

        /* ==================== BUTTONS ==================== */
        .btn-submit {
            display: block;
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            text-align: center;
            text-decoration: none;
        }

        .btn-submit:hover {
            background-color: var(--accent-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-toggle {
            background: none;
            border: none;
            color: var(--accent-color);
            font-weight: 600;
            cursor: pointer;
            font-size: 14px;
            padding: 0;
            text-decoration: none;
        }

        .btn-toggle:hover {
            text-decoration: underline;
        }

        /* ==================== FORM SECTIONS ==================== */
        .form-section {
            width: 100%;
        }

        .form-section.hidden {
            display: none;
        }

        /* ==================== FOOTER ==================== */
        .auth-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 13px;
        }

        .auth-footer a {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .toggle-section {
            color: var(--text-muted);
        }

        /* ==================== INFO MESSAGE ==================== */
        .info-message {
            margin-top: 16px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .info-message.error {
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fee2e2;
            display: block;
        }

        .info-message.success {
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #dcfce7;
            display: block;
        }

        /* ==================== RESPONSIVE ==================== */
        @media (max-width: 480px) {
            .auth-container {
                padding: 30px 20px;
            }
        }

        .active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="auth-container">
        <header class="auth-header">
            <div class="logo">RH<span>Manager</span></div>
            <h1 id="auth-title">Entrar</h1>
            <p id="auth-subtitle">Acesse o painel administrativo de RH</p>
        </header>

        <!-- ==================== LOGIN FORM ==================== -->
        <form id="login-form" class="form-section">
            <div class="form-group">
                <label for="login-email" class="form-label">E-mail corporativo</label>
                <input 
                    type="email" 
                    id="login-email" 
                    class="form-input" 
                    placeholder="exemplo@empresa.com" 
                    required
                >
            </div>

            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                    <label for="login-password" class="form-label" style="margin-bottom: 0;">Senha</label>
                    <a href="#" style="font-size: 12px; color: var(--accent-color); text-decoration: none;">Esqueceu a senha?</a>
                </div>
                <input 
                    type="password" 
                    id="login-password" 
                    class="form-input" 
                    placeholder="Sua senha secreta" 
                    required
                >
            </div>

            <button type="submit" class="btn-submit login">Acessar Painel</button>
            <div id="login-message" class="info-message"></div>
        </form>

        <!-- ==================== SIGNUP FORM ==================== -->
        <form id="signup-form" class="form-section hidden">
            <div class="form-group">
                <label for="signup-name" class="form-label">Nome de Usuário</label>
                <input 
                    type="text" 
                    id="signup-name" 
                    class="form-input" 
                    placeholder="Seu nome completo" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="signup-email" class="form-label">E-mail corporativo</label>
                <input 
                    type="email" 
                    id="signup-email" 
                    class="form-input" 
                    placeholder="seu@email.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="signup-password" class="form-label">Senha</label>
                <input 
                    type="password" 
                    id="signup-password" 
                    class="form-input" 
                    placeholder="Crie uma senha forte" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="signup-password-confirm" class="form-label">Confirmar Senha</label>
                <input 
                    type="password" 
                    id="signup-password-confirm" 
                    class="form-input" 
                    placeholder="Confirme sua senha" 
                    required
                >
            </div>

            <button type="submit" class="btn-submit create">Criar Conta</button>
            <div id="signup-message" class="info-message"></div>
        </form>

        <!-- ==================== FOOTER ==================== -->
        <footer class="auth-footer">
            <span class="toggle-section" id="toggle-text">Não tem uma conta? 
                <button type="button" class="btn-toggle" id="toggle-btn">Crie uma</button>
            </span>
        </footer>
    </div>

    <script>
        // New User screen 
        const screen_account = document.querySelector("#signup-form")

        // buttons and elements
        const btn_active_create_account = document.getElementById("toggle-btn")
        const btn_create_account = document.querySelector(".create")
        const btn_entrar =  document.querySelector(".login")
        
        function showpage(page) {
    document.querySelectorAll(".form-section").forEach(p => {
        p.classList.add("hidden")
        p.classList.remove("active")
    })
    page.classList.remove("hidden")
    page.classList.add("active")
}

    const users =
    JSON.parse(localStorage.getItem("users"))
    || [];

    // quando alguém entra o navegador vê que o usuario já contem dados salvos e devolve um texto e para transformar este texto em array novamente usamos JSON.parse(localStorage.getItem("users"))
    // mas caso não aja nenhuma informação salva o JSON.parse(localStorage.getItem("users")) não devolve nada (null) e neste caso usamos o array vazio

        btn_active_create_account.addEventListener('click', (e) => {
            e.preventDefault()
            showpage(screen_account)
        })

        btn_entrar.addEventListener('click', (event) => {
            event.preventDefault()
             login()})

          btn_create_account.addEventListener('click', (event) => {
          event.preventDefault()
          create()})     
        

        function login() {

            const emailInput = document.getElementById("login-email");
            const passwordInput = document.getElementById("login-password");
            //aqui pegamos os campos

            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value;
            // aqui pegamos os valores dos campos  
            const validacao = users.some(user => user.email == email && user.senha == password)
                                // forEach esta retornando undefined pois foi feito apenas para execuatr uma ação para cada elemento do array
                                // para este case utilize some(); ele devolve pelo menos um elemento que satisfaz a condição
           if (validacao) {
            window.location.href = "System/index.html"
           } else {
            alert("Create new account for you")
            emailInput.value = ""
            passwordInput.value = ""
           }
        }

        function create() {

            const new_nameInput = document.getElementById("signup-name")
        const new_emailInput = document.getElementById("signup-email")
        const new_passInput = document.getElementById("signup-password")
        const confirm_passInput = document.getElementById("signup-password-confirm")

            const new_name = document.getElementById("signup-name").value.trim()
        const new_email = document.getElementById("signup-email").value.trim()
        const new_pass = document.getElementById("signup-password").value
        const confirm_pass = document.getElementById("signup-password-confirm").value
       
        const existente = users.find(user => user.email === new_email && user.senha === new_pass)

       if (new_pass !== confirm_pass) {
           alert("senhas inconsistentes")
           return
       } else if (existente) {
        alert("esta conta já existe")
        return
       } else {
        users.push({
            nome: new_name,
            email: new_email,
            senha: new_pass
        })
        localStorage.setItem("users",
        // localStorage.setItem("users") guarde este texto para mim e não esqueça dele
            JSON.stringify(users))
            //json.stringify transforma o array em texto
            // setitem salve isso com este valor com esta chave 
            // getItem devolver oque foi salvo com a chave
            window.location.href = "System/index.html"
       }
     
   

        }

        





    </script>

</body>
</html>
